                >
                  <input required placeholder="Your Name" className="w-full px-3 py-2 rounded-xl bg-surface-container-low text-xs border border-transparent focus:bg-white focus:border-secondary focus:outline-none" />
                  <input required type="email" placeholder="Email Address" className="w-full px-3 py-2 rounded-xl bg-surface-container-low text-xs border border-transparent focus:bg-white focus:border-secondary focus:outline-none" />
                  <input required type="tel" placeholder="Phone Number" className="w-full px-3 py-2 rounded-xl bg-surface-container-low text-xs border border-transparent focus:bg-white focus:border-secondary focus:outline-none" />
                  <button type="submit" className="w-full mt-2 py-3 rounded-full bg-primary text-on-primary text-xs font-semibold shadow-xs">
                    Confirm Diagnostic Appointment
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 2-Min Quiz Modal */}
          {isQuizOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs">
              <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-botanical-lg flex flex-col gap-4 relative">
                <button onClick={() => setIsQuizOpen(false)} className="absolute top-4 right-4 text-outline hover:text-primary">
                  <span className="material-symbols-outlined text-[20px]">close</span>
                </button>
                <div className="flex items-center gap-2 text-xs font-semibold text-secondary uppercase">
                  <span className="material-symbols-outlined text-[16px]">psychology_alt</span>
                  <span>Clinical Diagnostic Quiz</span>
                </div>
                <h3 className="text-lg font-bold text-on-surface">What is your primary wellness aspiration right now?</h3>
                <div className="flex flex-col gap-2 pt-1">
                  {QUIZ_QUESTIONS[0].options.map((opt, i) => (
                    <button
                      key={i}
                      onClick={() => {
                        setIsQuizOpen(false);
                        setCurrentTab('plans');
                        try { confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } }); } catch {}
                        showToast(`Quiz Completed! Recommended Plan: ${opt.label}`);
                      }}
                      className="p-3 rounded-2xl bg-surface-container-low hover:bg-secondary-container hover:text-primary text-left text-xs font-medium transition-all flex items-center justify-between"
                    >
                      <span>{opt.label}</span>
                      <span className="material-symbols-outlined text-[16px]">chevron_right</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Recipe Detail Modal */}
          {activeRecipe && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-xl w-full shadow-botanical-lg overflow-hidden flex flex-col my-auto relative">
                <div className="relative w-full h-52 bg-surface-container">
                  <img src={activeRecipe.image} alt={activeRecipe.title} className="w-full h-full object-cover" />
                  <button onClick={() => setActiveRecipe(null)} className="absolute top-3 right-3 w-8 h-8 rounded-full bg-white/90 text-outline flex items-center justify-center">
                    <span className="material-symbols-outlined text-[18px]">close</span>
                  </button>
                  <div className="absolute bottom-3 left-3 right-3 flex items-end justify-between text-white drop-shadow-md">
                    <div>
                      <span className="px-2.5 py-0.5 rounded-full bg-white/90 text-primary text-xs font-semibold">{activeRecipe.categoryLabel}</span>
                      <h3 className="text-xl font-bold mt-1">{activeRecipe.title}</h3>
                    </div>
                    <span className="bg-primary px-3 py-1 rounded-full text-xs font-bold">{activeRecipe.calories} kcal</span>
                  </div>
                </div>
                <div className="p-6 flex flex-col gap-4 max-h-[70vh] overflow-y-auto no-scrollbar">
                  <div className="grid grid-cols-4 gap-2 bg-surface-container-low p-3 rounded-2xl text-center text-xs">
                    <div><span className="text-[10px] text-on-surface-variant">Protein</span><div className="font-bold text-primary">{activeRecipe.protein}</div></div>
                    <div><span className="text-[10px] text-on-surface-variant">Carbs</span><div className="font-bold text-primary">35g</div></div>
                    <div><span className="text-[10px] text-on-surface-variant">Fats</span><div className="font-bold text-primary">12g</div></div>
                    <div><span className="text-[10px] text-on-surface-variant">Fiber</span><div className="font-bold text-secondary">{activeRecipe.fiber}</div></div>
                  </div>
                  <div className="flex flex-col gap-2">
                    <span className="text-xs font-bold text-on-surface">Ingredients Checklist:</span>
                    {(activeRecipe.fullIngredients || activeRecipe.ingredients).map((ing, i) => (
                      <div key={i} className="p-2.5 rounded-xl bg-surface-container-low text-xs text-on-surface flex items-center gap-2">
                        <span className="material-symbols-outlined text-[16px] text-secondary">check</span>
                        <span>{ing}</span>
                      </div>
                    ))}
                  </div>
                  {activeRecipe.instructions && (
                    <div className="flex flex-col gap-2">
                      <span className="text-xs font-bold text-on-surface">Instructions:</span>
                      {activeRecipe.instructions.map((step, i) => (
                        <div key={i} className="text-xs text-on-surface-variant leading-relaxed">
                          <strong>{i + 1}.</strong> {step}
                        </div>
                      ))}
                    </div>
                  )}
                  <button
                    onClick={() => {
                      logMealToJournal(activeRecipe);
                      setActiveRecipe(null);
                    }}
                    className="w-full py-3 rounded-full bg-primary text-on-primary text-xs font-semibold flex items-center justify-center gap-1.5 shadow-xs"
                  >
                    <span className="material-symbols-outlined text-[18px]">bookmark_add</span>
                    <span>Log into Daily Nutrition Journal</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Daily Journal Modal */}
          {isJournalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-lg w-full shadow-botanical-lg overflow-hidden flex flex-col my-auto relative">
                <div className="p-5 bg-surface-container-low border-b border-surface-container flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <div className="w-10 h-10 rounded-2xl bg-secondary-container text-primary flex items-center justify-center">
                      <span className="material-symbols-outlined text-[22px]">menu_book</span>
                    </div>
                    <div>
                      <span className="text-xs text-secondary font-semibold uppercase">Daily Tracker</span>
                      <h3 className="text-lg font-bold text-primary">Nutrition Journal</h3>
                    </div>
                  </div>
                  <button onClick={() => setIsJournalOpen(false)} className="text-outline hover:text-primary">
                    <span className="material-symbols-outlined text-[20px]">close</span>
                  </button>
                </div>
                <div className="p-6 flex flex-col gap-5 max-h-[75vh] overflow-y-auto no-scrollbar">
                  {/* Calorie Progress */}
                  <div className="p-4 rounded-2xl bg-surface-container-low flex items-center justify-between">
                    <div>
                      <span className="text-xs text-on-surface-variant">Today's Intake</span>
                      <div className="text-xl font-bold text-primary">{loggedMeals.reduce((a, m) => a + (m.calories || 0), 0)} / 2000 kcal</div>
                    </div>
                    <div className="text-right">
                      <span className="text-xs text-on-surface-variant">Protein</span>
                      <div className="text-lg font-bold text-secondary">{loggedMeals.reduce((a, m) => a + (parseInt(m.protein, 10) || 0), 0)}g / 110g</div>
                    </div>
                  </div>

                  {/* Water Tracker */}
                  <div className="p-3.5 rounded-2xl bg-secondary-container/40 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="material-symbols-outlined text-[22px] text-secondary">water_drop</span>
                      <div>
                        <span className="text-xs font-semibold text-on-surface block">Hydration</span>
                        <span className="text-[11px] text-on-surface-variant">{waterGlasses} of 8 glasses ({waterGlasses * 250} ml)</span>
                      </div>
                    </div>
                    <button onClick={() => setWaterGlasses(p => Math.min(p + 1, 12))} className="px-3 py-1 rounded-full bg-primary text-on-primary text-xs font-semibold">
                      +1 Glass
                    </button>
                  </div>

                  {/* Logged Meals */}
                  <div className="flex flex-col gap-2">
                    <span className="text-xs font-bold text-on-surface">Logged Meals ({loggedMeals.length}):</span>
                    {loggedMeals.map((m, idx) => (
                      <div key={idx} className="p-3 rounded-2xl bg-surface-container-low flex items-center justify-between text-xs">
                        <div>
                          <div className="font-semibold text-on-surface">{m.title}</div>
                          <div className="text-on-surface-variant">{m.calories} kcal • {m.protein} Protein • {m.time}</div>
                        </div>
                        <button onClick={() => setLoggedMeals(p => p.filter((_, i) => i !== idx))} className="text-outline hover:text-error">
                          <span className="material-symbols-outlined text-[18px]">delete_outline</span>
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NutriBloomApp />);
  </script>
</body>
</html>
